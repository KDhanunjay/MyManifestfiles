---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mydb
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ola
  template:
    metadata:
      labels:
        app: ola
    spec:
      containers:
        - name: cont1
          image: nginx
          ports:
            - containerPort: 80